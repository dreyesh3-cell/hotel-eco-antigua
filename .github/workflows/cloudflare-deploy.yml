name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar aplicación
        run: pnpm run build

      - name: Configurar la cuenta y base D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/configure-cloudflare.mjs

      - name: Aplicar migraciones de la base de datos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply hotel-eco-antigua --remote --config dist/server/wrangler.json

      - name: Publicar sitio y API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
